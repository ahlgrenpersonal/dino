<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f67">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Dino">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dino</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=world7">
  </head>
  <body>
    <main class="game-shell" aria-label="Dino game">
      <section class="room" id="room" aria-live="polite">
        <div class="terrain-layer" id="terrainLayer" aria-hidden="true"></div>

        <div class="item-button" id="itemButton" aria-label="Boom berries">
          <span class="berry berry-one" aria-hidden="true"></span>
          <span class="berry berry-two" aria-hidden="true"></span>
          <span class="berry berry-three" aria-hidden="true"></span>
          <span class="item-glow" aria-hidden="true"></span>
        </div>

        <div class="enemy-layer" id="enemyLayer" aria-label="Enemies"></div>

        <div class="hero facing-down" aria-label="Dino explorer">
          <span class="hero-sprite" aria-hidden="true">
            <span class="club"></span>
            <span class="hero-body">
              <span class="hero-crest"></span>
              <span class="hero-eye eye-left"></span>
              <span class="hero-eye eye-right"></span>
              <span class="hero-smile"></span>
            </span>
            <span class="rock-shield">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </span>
        </div>
      </section>

      <section class="hud" aria-label="Inventory">
        <div>
          <p class="label">Pop seeds</p>
          <p class="score" id="bombCount">0</p>
        </div>
        <div>
          <p class="label">Finds</p>
          <p class="score" id="findCount">0</p>
        </div>
        <p class="status" id="statusText">Ready</p>
        <button class="bomb-button" type="button" id="bombButton" aria-label="Use pop seed">Pop</button>
        <button class="attack-button" type="button" id="attackButton" aria-label="Swing club">Club</button>
        <button class="reset-button" type="button" id="resetButton" aria-label="Reset room">Reset</button>
      </section>
    </main>

    <script src="app.js?v=world7" defer></script>
  </body>
</html>
