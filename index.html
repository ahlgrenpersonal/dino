<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f67">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Dino">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dino</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=room1">
  </head>
  <body>
    <main class="game-shell" aria-label="Dino game">
      <section class="room" aria-live="polite">
        <div class="room-tile tile-path"></div>
        <div class="room-tile tile-pond"></div>
        <div class="room-tile tile-rocks"></div>
        <div class="tree tree-one" aria-hidden="true"></div>
        <div class="tree tree-two" aria-hidden="true"></div>
        <div class="tree tree-three" aria-hidden="true"></div>

        <button class="item-button" type="button" id="itemButton" aria-label="Pick up boom berries">
          <span class="berry berry-one" aria-hidden="true"></span>
          <span class="berry berry-two" aria-hidden="true"></span>
          <span class="berry berry-three" aria-hidden="true"></span>
          <span class="item-glow" aria-hidden="true"></span>
        </button>

        <div class="hero" aria-label="Dino explorer">
          <span class="club" aria-hidden="true"></span>
          <span class="hero-body" aria-hidden="true">
            <span class="hero-crest"></span>
            <span class="hero-eye eye-left"></span>
            <span class="hero-eye eye-right"></span>
            <span class="hero-smile"></span>
          </span>
          <span class="rock-shield" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </div>
      </section>

      <section class="hud" aria-label="Inventory">
        <div>
          <p class="label">Boom berries</p>
          <p class="score" id="berryCount">0</p>
        </div>
        <p class="status" id="statusText">Ready</p>
        <button class="reset-button" type="button" id="resetButton" aria-label="Reset room">Reset</button>
      </section>
    </main>

    <script src="app.js?v=room1" defer></script>
  </body>
</html>
