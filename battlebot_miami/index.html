<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#192c30">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="description" content="A playful robot adventure through a small, north-up Miami. Explore, beat friendly monster bosses and build your bot.">
 <title>Battle Bot Miami</title>
 <link rel="icon" href="icon.svg" type="image/svg+xml">
 <link rel="apple-touch-icon" href="icon-192.png">
 <link rel="manifest" href="manifest.webmanifest">
 <link rel="stylesheet" href="adventure.css?v=world23">
 <link rel="stylesheet" href="adventure-layout.css?v=world23">
 <link rel="stylesheet" href="styles.css?v=world23">
</head>
<body data-details="false">
 <main id="game">
  <header class="topbar">
   <canvas id="brandBot" width="100" height="100" class="brand-bot" aria-hidden="true"></canvas>
   <div class="wallet" title="Scrap for upgrades"><span>◆</span> <b id="scrapCount">0</b></div>
   <button id="pause" class="icon-button" title="Pause" aria-label="Pause">Ⅱ</button>
  </header>
  <section id="playfield" aria-label="Miami adventure">
   <canvas id="world" tabindex="0" aria-label="Tap land to move your bot. Tap a monster for power. Attacks happen automatically. Arrow keys or WASD also move."></canvas>
   <div class="compass" aria-label="North is up"><b class="adult-copy">N</b><span>↑</span></div>
   <div id="bossHud" class="boss-hud" hidden><canvas id="bossPortrait" width="100" height="100" aria-hidden="true"></canvas><span id="royalGuard" aria-label="Use Power then tap the boss to break its shield" hidden>🛡 ϟ ☝</span><b id="bossName" class="adult-copy"></b><div><i id="bossHealth"></i></div></div>
   <div id="toast" class="toast" role="status"></div>
   <button id="interact" class="interact" aria-label="Recharge at charging station for 2 scrap" hidden><span aria-hidden="true">＋ ◆ 2</span><span class="adult-copy">Recharge</span></button>
   <div class="move-hint" id="moveHint" aria-hidden="true">☝ ⟶ 🤖</div>
  </section>
  <footer class="console">
   <div class="health-row"><span class="heart">♥</span><div class="health-track"><i id="healthFill"></i></div><b id="healthText" class="adult-copy">110 / 110</b><canvas id="weaponBadge" width="120" height="70" aria-hidden="true"></canvas><span id="weaponLabel" class="adult-copy">Bumper Blaster</span></div>
   <nav class="tools" aria-label="Adventure controls">
    <button id="home" aria-label="Home" hidden><span>⌂</span><b class="adult-copy">Home</b></button>
    <button id="map" aria-label="Map"><span aria-hidden="true"><img class="map-icon" src="assets/map.svg" alt=""></span><b class="adult-copy">Map</b></button>
    <button id="power" class="boost" aria-label="Power"><span>ϟ</span><b id="powerLabel" class="adult-copy">Power</b></button>
    <button id="build" aria-label="Build"><span>⚙</span><b class="adult-copy">Build</b></button>
    <button id="sound" aria-label="Turn sound on"><span>♪</span><b id="soundLabel" class="adult-copy">Sound off</b></button>
   </nav>
  </footer>
 </main>
 <dialog id="panel" aria-labelledby="panelTitle"><div id="panelContent"></div></dialog>
 <audio id="music" src="assets/miami-theme.mp3" preload="auto" loop hidden></audio>
 <script type="module" src="app.js?v=world23"></script>
</body>
</html>
