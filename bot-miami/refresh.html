<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#192c30"><title>Refresh Bot Miami</title><body style="background:#192c30;color:#dcf0df;font-family:system-ui;padding:40px"><h1>Fresh batteries...</h1><p>Your adventure stays saved.</p><script>
(async()=>{try{const scope=new URL('./',location.href).href;for(const reg of await navigator.serviceWorker.getRegistrations())if(reg.scope===scope)await reg.unregister();for(const key of await caches.keys())if(key.startsWith('bot-miami-'))await caches.delete(key);}catch{}location.replace('./index.html?fresh='+Date.now());})();
</script></body></html>
