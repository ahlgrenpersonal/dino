<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172f46"><title>Refresh SkySpark</title><body style="background:#172f46;color:#fff0d4;font:17px system-ui;padding:30px"><h1>Refreshing SkySpark</h1><p>Your saved adventure stays safe.</p><script type="module">const scope=new URL('./',location.href).href;try{for(const r of await navigator.serviceWorker.getRegistrations())if(r.scope===scope)await r.unregister();for(const n of await caches.keys())if(n.startsWith('skyspark-'))await caches.delete(n);location.replace('index.html?fresh='+Date.now());}catch{document.querySelector('p').textContent='Please reopen SkySpark when you are online. Your save has not been changed.';}</script></body></html>
